<script>

  Array.prototype.forEach.call(document.querySelectorAll('meta[name="theme-color"]'), function (m) { m.setAttribute('content', t === 'dark' ? '#09090B' : '#F4F4F5'); }); } } catch (err) {} })();

<style>

:root { padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  --page: #F4F4F5; --panel: #FFFFFF; --ink: #09090B; --t2: #3F3F46; --t3: #63636E; --border: #E4E4E7; --field: #D4D4D8;
  --go: #09090B; --go-hi: #3F3F46; --go-ink: #FFFFFF; --warn: #B0370A; --brand: #09090B; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --page: #09090B; --panel: #141417; --ink: #FAFAFA; --t2: #C4C4CC; --t3: #9C9CA7; --border: rgba(255,255,255,0.09); --field: rgba(255,255,255,0.22);
  --go: #FAFAFA; --go-hi: #D4D4D8; --go-ink: #141417; --warn: #FB8C5A; color-scheme: dark; } }
:root[data-theme="dark"] {
  --page: #09090B; --panel: #141417; --ink: #FAFAFA; --t2: #C4C4CC; --t3: #9C9CA7; --border: rgba(255,255,255,0.09); --field: rgba(255,255,255,0.22);
  --go: #FAFAFA; --go-hi: #D4D4D8; --go-ink: #141417; --warn: #FB8C5A; color-scheme: dark; }
* { box-sizing: border-box; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; justify-items: center; align-content: start; padding: 1.5rem max(16px, env(safe-area-inset-right, 0px)) 1.5rem max(16px, env(safe-area-inset-left, 0px));
  background: var(--page); color: var(--ink); font: 400 1rem/1.5 Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
main { width: 100%; max-width: 23rem; margin-top: clamp(0px, calc(50vh - 15rem), 12rem); padding: 1.75rem 1.5rem 1.5rem; border-radius: 1rem; background: var(--panel); border: 1px solid var(--border); }
.logo { display: block; height: 2.5rem; width: auto; --lg-ink: var(--ink); --lg-accent: var(--brand); --lg-paper: var(--panel); --lg-sub: var(--t3); }
h1 { margin: 1.5rem 0 0.375rem; font-size: 1.375rem; line-height: 1.25; font-weight: 600; letter-spacing: -0.02em; text-wrap: balance; }
p { margin: 0; color: var(--t2); font-size: 0.9375rem; text-wrap: balance; }
form { display: grid; gap: 0.75rem; margin-top: 1.25rem; }
.row { display: grid; gap: 0.375rem; }
label { font-size: 0.875rem; font-weight: 500; color: var(--t2); }
.field { position: relative; display: block; }
input { display: block; width: 100%; height: 2.875rem; padding: 0 4.25rem 0 0.875rem; border-radius: 0.625rem; border: 1px solid var(--field); background: var(--panel); color: var(--ink);
  font: inherit; font-size: 1rem; letter-spacing: 0.01em; }
input::placeholder { color: var(--t3); opacity: 1; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.show { position: absolute; top: 0.3125rem; right: 0.3125rem; height: 2.25rem; padding: 0 0.625rem; border: 0; border-radius: 0.4375rem; background: transparent; color: var(--t2);
  font: inherit; font-size: 0.875rem; font-weight: 500; cursor: pointer; }
.go { height: 2.875rem; border: 1px solid transparent; border-radius: 0.625rem; background: var(--go); color: var(--go-ink); font: inherit; font-weight: 600; cursor: pointer; }
.go:hover { background: var(--go-hi); }
.go[disabled], .show[disabled] { cursor: default; opacity: 0.6; }
.go[disabled]:hover { background: var(--go); }
.say { font-size: 0.875rem; color: var(--warn); text-wrap: balance; }
.say:empty { margin-top: -0.75rem; }
@media (hover: none) { .go:hover { background: var(--go); } }
@media (prefers-reduced-motion: no-preference) { .go { transition: background 0.15s; } }
</style>
