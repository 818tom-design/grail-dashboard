<style id="gate-style">
/* The gate of a locked Collector page. It is the whole page until the access code opens the seal below. Then this block,
   the form and the seal are taken away and the page is put in their place. The colours are the palette of the pages. */
:root { --page: #F4F4F5; --panel: #FFFFFF; --ink: #09090B; --t2: #3F3F46; --t3: #63636E; --line: rgba(9,9,11,0.48); --line-hi: rgba(9,9,11,0.62);
  --brand: #1D75CD; --brand-hi: #1A6CBF; --on-brand: #FFFFFF; --brand-type: #1A6CBF; --loss: #B0370A;
  --lg-ink: var(--ink); --lg-accent: var(--brand); --lg-paper: var(--page); --lg-sub: var(--t3); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #09090B; --panel: #141417; --ink: #FAFAFA; --t2: #C4C4CC; --t3: #9C9CA7;
  --line: rgba(250,250,250,0.40); --line-hi: rgba(250,250,250,0.62); --brand: #1D75CD; --brand-hi: #1A6CBF; --on-brand: #FFFFFF; --brand-type: #4299F0; --loss: #FB8C5A; color-scheme: dark; } }
:root[data-theme="dark"] { --page: #09090B; --panel: #141417; --ink: #FAFAFA; --t2: #C4C4CC; --t3: #9C9CA7;
  --line: rgba(250,250,250,0.40); --line-hi: rgba(250,250,250,0.62); --brand: #1D75CD; --brand-hi: #1A6CBF; --on-brand: #FFFFFF; --brand-type: #4299F0; --loss: #FB8C5A; color-scheme: dark; }
body { margin: 0; background: var(--page); color: var(--ink); }
/* until the title face arrives, a face of the device stands in at the width of the title face, so that the title does not break into two lines and jump */
@font-face { font-family: "Gate Title Fallback"; src: local("Georgia"), local("Noto Serif"); size-adjust: 74%; }
/* a word that the styles show by themselves after 8 seconds, and that the script takes away as soon as it runs: so a page whose
   script did not arrive or may not run is never a blank page with no word */
#gate-late { margin: 0; padding: 24px 16px; font: 16px/1.5 system-ui, sans-serif; visibility: hidden; animation: gate-late 0s linear 8s forwards; }
@keyframes gate-late { to { visibility: visible; } }
#gate[hidden] { display: none; }
#gate, #gate * { box-sizing: border-box; }
#gate { display: grid; justify-items: center; padding-block: clamp(2rem, 16vh, 9rem) 2rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  font: 400 0.9375rem/1.5 Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
#gate .g-box { width: 100%; max-width: 21.5rem; }
#gate .logo-full { display: block; height: 2.5rem; width: auto; }
#gate h1 { margin: 2.25rem 0 0.5rem; font: 400 2.25rem/1.08 "Instrument Serif", "Gate Title Fallback", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif; letter-spacing: -0.006em; text-wrap: balance; }
#gate p { margin: 0; color: var(--t2); text-wrap: balance; }
#gate form { display: grid; gap: 0.5rem; margin: 1.75rem 0 0; }
#gate label { font-size: 0.8125rem; font-weight: 600; color: var(--t2); }
#gate .g-field { position: relative; display: block; }
#gate input { display: block; width: 100%; height: 2.875rem; margin: 0; padding: 0 4.5rem 0 0.75rem; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink);
  font: inherit; font-size: 1rem; font-weight: 500; letter-spacing: 0.01em; }
#gate input:hover { border-color: var(--line-hi); }
#gate input[aria-invalid="true"] { border-color: var(--loss); }
#gate button { margin: 0; font: inherit; cursor: pointer; }
#gate input:focus, #gate button:focus-visible { outline: 2px solid var(--brand-type); outline-offset: 1px; }
#gate input:focus:not(:focus-visible) { outline: none; }
#gate input[aria-invalid="true"]:focus { outline-color: var(--loss); }
#gate .g-show:focus-visible { outline-offset: -3px; }   /* its ring is drawn inside the field */
#gate input::-ms-reveal, #gate input::-ms-clear { display: none; }
#gate .g-show { position: absolute; top: 1px; right: 1px; height: calc(100% - 2px); min-width: 4rem; padding: 0 0.875rem; border: 0; border-radius: 7px; background: transparent; color: var(--brand-type);
  font-size: 0.8125rem; font-weight: 600; }
#gate .g-go { position: relative; height: 2.875rem; margin-top: 0.25rem; padding: 0 1.25rem; border: 1px solid transparent; border-radius: 999px; background: var(--brand); color: var(--on-brand); font-size: 0.9375rem; font-weight: 600; }
#gate .g-go:hover { background: var(--brand-hi); }
#gate .g-go[disabled], #gate .g-show[disabled] { cursor: default; opacity: 0.6; }
#gate .g-go[disabled]:hover { background: var(--brand); }
#gate .g-go[aria-busy="true"] { opacity: 1; cursor: progress; }
#gate .g-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
#gate .g-say { min-height: 1.3125rem; margin-top: 0; font-size: 0.875rem; font-weight: 500; color: var(--loss); text-wrap: balance; }
@media (max-width: 640px) { #gate { padding-top: clamp(1.5rem, 10vh, 6rem); } }
@media (hover: none) { #gate .g-go:hover { background: var(--brand); } #gate input:hover { border-color: var(--line); } }
@media (prefers-reduced-motion: no-preference) { #gate .g-go { transition: background-color 0.2s; } #gate input { transition: border-color 0.2s; }
  #gate .g-go[aria-busy="true"]::before { content: ""; position: absolute; left: 1.25rem; right: 1.25rem; bottom: 0.3125rem; height: 2px; border-radius: 1px; background: currentColor; opacity: 0.75; transform-origin: left center; animation: g-fill 1.1s cubic-bezier(.2,.7,.2,1) infinite; } }
@keyframes g-fill { from { transform: scaleX(0); } }
</style>
<script id="gate-look">

(function () { var t = document.getElementById('gate-fonts'), l = t && t.content && t.content.firstElementChild; if (l) t.parentNode.insertBefore(l, t); })();
/* A saved light or dark choice is applied before the first paint, as the page behind this one applies it. */
(function () { try { var t = localStorage.getItem('grail-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (err) {} })();
</script>
